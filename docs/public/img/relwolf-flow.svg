<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" width="720" height="612" role="img" aria-labelledby="t d">
<title id="t">relwolf run flowchart</title>
<desc id="d">Each run has two phases. A push to the default branch starts the relwolf CI job. Phase 1, tag merged releases: if a merged release request labelled relwolf: pending exists, relwolf tags the merge commit and creates the release. Phase 2, prepare the next release: if there are releasable commits since the last release, relwolf computes the version, changelog and version files and creates or updates the release request. A human reviews and merges it, and the next push starts the cycle again. Otherwise there is nothing to release.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5e63"/></marker></defs>
<style>text{font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1a1a1a}.l{font-size:12px;fill:#5e5e63}.g{font-size:12px;font-weight:600;fill:#5e5e63}</style>
<rect x="84" y="134" width="632" height="100" rx="12" fill="#5e5e63" fill-opacity="0.09" stroke="#5e5e63" stroke-dasharray="6 4" stroke-width="1.3"/><text x="704" y="154" text-anchor="end" class="g">Phase 1 · Tag merged releases</text><rect x="84" y="250" width="632" height="284" rx="12" fill="#5e5e63" fill-opacity="0.09" stroke="#5e5e63" stroke-dasharray="6 4" stroke-width="1.3"/><text x="704" y="270" text-anchor="end" class="g">Phase 2 · Prepare the next release</text><rect x="110" y="10" width="300" height="40" rx="20.0" fill="#dff4f1" stroke="#228f82" stroke-width="1.5"/><text x="260.0" y="35.0" text-anchor="middle">Push to the default branch</text><rect x="110" y="80" width="300" height="40" rx="8" fill="#ebeaef" stroke="#3a2e5e" stroke-width="1.5"/><text x="260.0" y="105.0" text-anchor="middle">relwolf CI job</text><rect x="110" y="166" width="300" height="52" rx="8" fill="#f5f2ed" stroke="#5e5e63" stroke-width="1.5"/><text x="260.0" y="188.5" text-anchor="middle">Merged release request</text><text x="260.0" y="205.5" text-anchor="middle">labelled “relwolf: pending”?</text><rect x="470" y="166" width="230" height="52" rx="8" fill="#ebeaef" stroke="#3a2e5e" stroke-width="1.5"/><text x="585.0" y="188.5" text-anchor="middle">Tag the merge commit and</text><text x="585.0" y="205.5" text-anchor="middle">create the release</text><rect x="110" y="282" width="300" height="52" rx="8" fill="#f5f2ed" stroke="#5e5e63" stroke-width="1.5"/><text x="260.0" y="304.5" text-anchor="middle">Releasable commits</text><text x="260.0" y="321.5" text-anchor="middle">since the last release?</text><rect x="470" y="288" width="230" height="40" rx="20.0" fill="#dff4f1" stroke="#228f82" stroke-width="1.5"/><text x="585.0" y="313.0" text-anchor="middle">Nothing to release</text><rect x="110" y="374" width="300" height="52" rx="8" fill="#ebeaef" stroke="#3a2e5e" stroke-width="1.5"/><text x="260.0" y="396.5" text-anchor="middle">Compute version, changelog</text><text x="260.0" y="413.5" text-anchor="middle">and version files</text><rect x="110" y="466" width="300" height="52" rx="8" fill="#ebeaef" stroke="#3a2e5e" stroke-width="1.5"/><text x="260.0" y="488.5" text-anchor="middle">Create or update the release request</text><text x="260.0" y="505.5" text-anchor="middle">from branch relwolf/&lt;branch&gt;</text><rect x="110" y="558" width="300" height="40" rx="8" fill="#f5f2ed" stroke="#5e5e63" stroke-width="1.5"/><text x="260.0" y="583.0" text-anchor="middle">Review and merge</text><path d="M260.0 50 V78" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><path d="M260.0 120 V164" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><path d="M410 192 H468" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><text x="420" y="184" class="l" text-anchor="start">yes</text><path d="M260.0 218 V280" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><text x="268.0" y="244" class="l" text-anchor="start">no</text><path d="M585.0 218 V242 H320.0 V280" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><path d="M410 308 H468" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><text x="420" y="300" class="l" text-anchor="start">no</text><path d="M260.0 334 V372" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><text x="268.0" y="358" class="l" text-anchor="start">yes</text><path d="M260.0 426 V464" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><path d="M260.0 518 V556" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><path d="M110 578 H40 V30 H108" fill="none" stroke="#5e5e63" stroke-width="1.6" marker-end="url(#a)"/><text class="l" text-anchor="middle" transform="translate(30 304) rotate(-90)">merged, or more commits arrive</text>
</svg>