name: relwolf Release Bot
description: Release bot based on Conventional Commits - opens a release pull request and tags merged releases
author: lupiq
branding:
  icon: tag
  color: gray-dark

inputs:
  token:
    description: Access token used for all API calls (becomes RELWOLF_TOKEN)
    required: true
  release-as:
    description: Forces the version of the next release, e.g. 1.0.0 or component=1.0.0 (becomes RELWOLF_RELEASE_AS); auto removes a request
    required: false
    default: ''

runs:
  using: docker
  image: docker://ghcr.io/lupiq/relwolf:0.6.2 # x-relwolf-version
  entrypoint: relwolf
  env:
    RELWOLF_TOKEN: ${{ inputs.token }}
    RELWOLF_RELEASE_AS: ${{ inputs.release-as }}
