name: E2E

# Runs the real release flow against a sandbox project on gitlab.com and a sandbox repository on github.com (see e2e/).
# GitLab needs the secret GITLAB_E2E_TOKEN and GITLAB_E2E_PROJECT_ID (secret or variable).
# GitHub needs the secret GH_E2E_TOKEN and GH_E2E_REPOSITORY, e.g. "lupiq/relwolf-e2e" (secret or variable).

on:
  workflow_dispatch:
  push:
    branches: [main]

# The scenarios of a provider share one sandbox, so only one run may use it at a time.
concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm test:e2e e2e/gitlab.e2e.test.ts
        env:
          GITLAB_E2E_TOKEN: ${{ secrets.GITLAB_E2E_TOKEN }}
          GITLAB_E2E_PROJECT_ID: ${{ secrets.GITLAB_E2E_PROJECT_ID || vars.GITLAB_E2E_PROJECT_ID }}
      - name: Job summary
        if: always()
        run: node e2e/summary.ts e2e-report.json GitLab

  github:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm test:e2e e2e/github.e2e.test.ts
        env:
          GH_E2E_TOKEN: ${{ secrets.GH_E2E_TOKEN }}
          GH_E2E_REPOSITORY: ${{ secrets.GH_E2E_REPOSITORY || vars.GH_E2E_REPOSITORY }}
      - name: Job summary
        if: always()
        run: node e2e/summary.ts e2e-report.json GitHub
