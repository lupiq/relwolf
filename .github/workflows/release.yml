name: Release

# relwolf releases itself: it opens/updates a release pull request and,
# once that is merged, tags the commit and creates the GitHub release.
#
# RELWOLF_TOKEN must be a personal access token (not GITHUB_TOKEN), otherwise
# the tag push would not trigger the "Publish image" workflow.
# Required permissions: contents: write, pull requests: write.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Force the next version, e.g. 1.0.0 ("auto" removes a request)'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node dist/cli.js
        env:
          RELWOLF_TOKEN: ${{ secrets.RELWOLF_TOKEN }}
          RELWOLF_RELEASE_AS: ${{ inputs.release-as }}
