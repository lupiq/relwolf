name: Release

# relwolf releases itself: it opens/updates a release pull request and,
# once that is merged, tags the commit and creates the GitHub release.
#
# The token is created from a GitHub App (variable RELWOLF_APP_CLIENT_ID, secret RELWOLF_APP_PRIVATE_KEY), so the
# release pull requests are not authored by a maintainer. It must not be GITHUB_TOKEN, otherwise the tag push would
# not trigger the "Publish image" workflow.
# Required app permissions: contents: write, pull requests: write, issues: write (labels and assignees).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Force the next version, e.g. 1.0.0 ("auto" removes a request)'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELWOLF_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELWOLF_APP_PRIVATE_KEY }}
      - run: node dist/cli.js
        env:
          RELWOLF_TOKEN: ${{ steps.app-token.outputs.token }}
          RELWOLF_RELEASE_AS: ${{ inputs.release-as }}
