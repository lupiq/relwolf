# yaml-language-server: $schema=https://relwolf.lupiq.io/schema.json
branch: main

# Dependency updates (Renovate uses `build`) end up in the image and therefore trigger a patch release
patch-types: [fix, build, docs]

release-emoji: true

# Runs Prettier over the generated changelog before the release commit
pre-commit-script: scripts/format.sh

packages:
  '.':
    updaters:
      - type: package-json
      - type: generic
        path: action.yml
      - type: generic
        path: src/app-version.ts
      - type: generic
        path: README.md
      - type: generic
        path: docs/guide/gitlab.md
      - type: generic
        path: docs/guide/github.md
      - type: generic
        path: docs/guide/release-as.md
      - type: generic
        path: docs/reference/github-vs-gitlab.md
      - type: generic
        path: docs/reference/docker-image.md
