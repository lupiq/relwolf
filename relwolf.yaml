# yaml-language-server: $schema=https://relwolf.lupiq.io/schema.json
branch: main

# Dependency updates (Renovate uses `build`) end up in the image and therefore trigger a patch release
patch-types: [fix, build, docs]

release-emoji: true

# AI release notes for every release in the release request, the release and RELEASE_NOTES.md (GitHub Copilot CLI)
ai-release-notes:
  generate: manual
  model: claude-sonnet-5.5
  context: full-diff
  max-input-chars: 140000
  # Only code and documentation are relevant for users
  include-paths:
    - src/**
    - docs/**
    - skills/**
    - README.md
    - action.yml
    - Dockerfile
    - package.json
  exclude-paths:
    - docs/public/schema.json
  language: English
  audience: developers
  usage-comment: true
  release: true
  prompt: |
    Summarize this software release in ${language} for ${audience}.
    Write a concise but substantive release summary: usually one to three short paragraphs or four to eight bullets,
    with more detail when the release contains several meaningful changes and less detail for a small release.
    Use Markdown without headings and use **bold** selectively to highlight important features, breaking changes, APIs,
    options, commands, and compatibility details.
    Prefer top-level bullets with bold topic labels and nested bullets for supporting details; use paragraphs only when
    they make a small release clearer.
    Explain the important changes and their practical or technical impact instead of merely repeating commit messages.
    Group related changes and describe the resulting behavior, APIs, configuration, integrations, and migration implications.
    Highlight breaking changes first, especially newly added, changed, or removed properties, options, commands, or interfaces.
    Mention notable fixes, compatibility changes, and improvements when they materially affect developers.
    Only describe changes that are relevant for users: actual code changes and documentation. Leave out changes to
    configuration, CI workflows, tooling and dependency updates, and do not mention that they were left out.
    Do not enumerate every changed file or low-level implementation detail unless it helps explain the change.
    Use only evidence from the provided release context, do not invent motivation or behavior, and answer with the summary only.
  additional-files:
    - file: RELEASE_NOTES.md
      file-title: Release Notes

assignees:
  - nioe

reviewers:
  - nioe

# Runs Prettier over the generated changelog before the release commit
pre-commit-script: scripts/format.sh

packages:
  '.':
    updaters:
      - type: package-json
      - type: generic
        path: action.yml
      - type: generic
        path: src/app-version.ts
      - type: generic
        path: README.md
      - type: generic
        path: docs/index.md
      - type: generic
        path: docs/guide/gitlab.md
      - type: generic
        path: docs/guide/github.md
      - type: generic
        path: docs/guide/release-as.md
      - type: generic
        path: docs/reference/github-vs-gitlab.md
      - type: generic
        path: docs/reference/docker-image.md
      - type: generic
        path: skills/relwolf-setup/references/ci-github.md
      - type: generic
        path: skills/relwolf-setup/references/ci-gitlab.md
